# Live aircraft for plugins/planes: a cached proxy to adsb.lol (ODbL), with OpenSky as a fallback; neither sends
# CORS headers. Each location asks one fixed question (all aircraft over the Lower Mainland), so this is not an
# open proxy, and every visitor shares one upstream request per 5 s (15 s for OpenSky, which has a daily quota).
# Errors are cached for 30 s and stale answers served meanwhile, so a failing upstream is not hammered.
proxy_cache_path /var/cache/nginx/adsb levels=1 keys_zone=adsb:1m max_size=20m inactive=10m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=adsb_ip:1m rate=1r/s;

server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/javascript text/javascript application/json application/octet-stream;
  # the page may be framed by X (the player card: index.html's twitter:player, /play below); add_header here, as
  # a location's own add_header drops the server's
  set $frame "frame-ancestors 'self' https://x.com https://*.x.com https://twitter.com https://*.twitter.com";
  location = / { add_header Cache-Control "no-cache"; add_header Content-Security-Policy $frame; try_files /index.html =404; }
  location = /play { add_header Cache-Control "no-cache"; add_header Content-Security-Policy $frame; try_files /index.html =404; } # the embed (index.html)
  # a link to a spot (the full site's #X,Y,zoom): a card whose player opens /play there; people are sent on to /#X,Y,zoom
  location ~ "^/at/(-?\d{1,6},-?\d{1,6},\d{1,2}(\.\d{1,6})?)$" {
    default_type text/html;
    add_header Cache-Control "public, max-age=3600";
    return 200 '<!doctype html><meta charset="utf-8"><title>Vancouver in code</title>
<meta property="og:type" content="website"><meta property="og:url" content="https://vancouver.borodutch.com/at/$1">
<meta property="og:title" content="Vancouver in code"><meta property="og:description" content="An isometric Vancouver drawn entirely in code from OpenStreetMap.">
<meta property="og:image" content="https://vancouver.borodutch.com/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="player"><meta name="twitter:title" content="Vancouver in code"><meta name="twitter:description" content="An isometric Vancouver drawn entirely in code from OpenStreetMap.">
<meta name="twitter:player" content="https://vancouver.borodutch.com/play?at=$1"><meta name="twitter:player:width" content="480"><meta name="twitter:player:height" content="480">
<meta name="twitter:image" content="https://vancouver.borodutch.com/card.jpg">
<script>location.replace("/#$1")</script><a href="/#$1">Vancouver in code</a>
';
  }
  location / { add_header Cache-Control "public, max-age=3600"; try_files $uri $uri.html =404; }
  # page code (unversioned URLs): revalidate every load (304 when unchanged) so a deploy never mixes old modules
  # with a new index.html
  location ~* \.(js|mjs|css|html)$ { add_header Cache-Control "no-cache"; add_header Content-Security-Policy $frame; try_files $uri =404; }
  # map tiles (tools/tiles.py) live on a volume mounted here; they are gzip files already, so nginx leaves
  # them alone. URLs carry the bake's ?v=, so a rebake is picked up at once and old tiles can be cached long.
  location = /tiles/index.json { gzip on; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /tiles/ { gzip off; add_header Cache-Control "public, max-age=604800, immutable"; add_header Access-Control-Allow-Origin "*"; try_files $uri =404; }
  include /etc/nginx/dev.d/*.conf; # compose.yaml renders docker/dev.conf.template here (/live proxy, tile fallback); empty in production

  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off; # upstream names are re-resolved (proxy_pass with a variable)
  location = /adsb/lm {
    limit_req zone=adsb_ip burst=5 nodelay;
    set $adsb_host api.adsb.lol;
    proxy_pass https://$adsb_host/v2/point/49.24/-122.87/25;
    proxy_set_header Host api.adsb.lol;
    proxy_ssl_server_name on;
    proxy_ssl_name api.adsb.lol;
    proxy_set_header User-Agent "vancouver.borodutch.com (+https://git.borodutch.com/backmeupplz/vancouver)";
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding ""; # cache plain JSON; gzip above compresses it per client
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_cache adsb;
    proxy_cache_key adsb-lol;
    proxy_cache_valid 200 5s;
    proxy_cache_valid any 30s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store";
    add_header X-Cache $upstream_cache_status;
  }
  location = /adsb/opensky {
    limit_req zone=adsb_ip burst=5 nodelay;
    set $opensky_host opensky-network.org;
    proxy_pass https://$opensky_host/api/states/all?lamin=48.95&lomin=-123.45&lamax=49.52&lomax=-122.3&extended=1;
    proxy_set_header Host opensky-network.org;
    proxy_ssl_server_name on;
    proxy_ssl_name opensky-network.org;
    proxy_set_header User-Agent "vancouver.borodutch.com (+https://git.borodutch.com/backmeupplz/vancouver)";
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding "";
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_cache adsb;
    proxy_cache_key opensky;
    proxy_cache_valid 200 15s;
    proxy_cache_valid any 60s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store";
    add_header X-Cache $upstream_cache_status;
  }
}
