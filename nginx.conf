server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/javascript text/javascript application/json application/octet-stream;
  types { application/octet-stream bin; }
  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location / { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
}
