[package]
name = "vancouver-live"
version = "0.1.0"
edition = "2024"
description = "Live visitor counts, multiplayer presence and chat for vancouver.borodutch.com"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
hmac = "0.12"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
